name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: 62.238.47.178
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/ubuntu/nuncacierro
            git pull
            docker compose build nc-api nc-dashboard
            # --no-deps + lista explícita: SOLO se recrean nc-api y nc-dashboard.
            # Caddy (sin 502), n8n, postgres, redis y evolution-api quedan intactos.
            docker compose up -d --no-deps nc-api nc-dashboard
            docker system prune -f
